# Resolve mips.lan → IP do servidor na LAN
# O setup-https.sh atualiza este arquivo automaticamente
address=/mips.lan/192.168.0.150

# DNS upstream (Google, Cloudflare)
no-resolv
server=8.8.8.8
server=8.8.4.4
server=1.1.1.1

# Não manda para a internet nomes sem ponto nem reverso de IP privado
domain-needed
bogus-priv

# Este DNS atende a rede inteira: cache maior (era 100) e mais consultas simultâneas
cache-size=1000
dns-forward-max=500

# Log de consultas DESLIGADO (21/11/2026): gravava toda consulta da rede em
# /var/log/dnsmasq.log dentro do container (166 MB em 5 dias, sem rotação).
# Para depurar: descomente as duas linhas e `docker compose restart dnsmasq`.
# log-queries
# log-facility=/var/log/dnsmasq.log
