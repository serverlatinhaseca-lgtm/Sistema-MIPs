# Resolve mips.local → IP do servidor na LAN
# O setup-https.sh atualiza este arquivo automaticamente
address=/mips.local/LAN_IP_PLACEHOLDER

# DNS upstream (Google, Cloudflare)
no-resolv
server=8.8.8.8
server=8.8.4.4
server=1.1.1.1

# Logs (útil para debug)
log-queries
log-facility=/var/log/dnsmasq.log
cache-size=100